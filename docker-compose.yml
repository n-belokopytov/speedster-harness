services:
  em-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        ROLE: em
        MODEL: ${MODEL:-default}
    environment:
      ROLE: em
      MODEL: ${MODEL:-default}
      HOST: 0.0.0.0
      PORT: 8080
      REPO_ROOT: /workspace
    ports:
      - "${EM_AGENT_PORT:-8081}:8080"
    volumes:
      - ./:/workspace
      - ./state:/app/state
    restart: unless-stopped

  engineer-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        ROLE: engineer
        MODEL: ${MODEL:-default}
    environment:
      ROLE: engineer
      MODEL: ${MODEL:-default}
      HOST: 0.0.0.0
      PORT: 8080
      REPO_ROOT: /workspace
      GIT_SSH_KEY: /run/secrets/github_ssh_key
      REPO_URL: ${REPO_URL:-}
    ports:
      - "${ENG_AGENT_PORT:-8082}:8080"
    volumes:
      - ./:/workspace
      - ./state:/app/state
      - ${SSH_KEY_PATH:-~/.ssh/id_speedster}:/run/secrets/github_ssh_key:ro
    restart: unless-stopped

  qa-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        ROLE: qa
        MODEL: ${MODEL:-default}
    environment:
      ROLE: qa
      MODEL: ${MODEL:-default}
      HOST: 0.0.0.0
      PORT: 8080
      REPO_ROOT: /workspace
    ports:
      - "${QA_AGENT_PORT:-8083}:8080"
    volumes:
      - ./:/workspace
      - ./state:/app/state
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: speedster/Dockerfile
    environment:
      EM_AGENT_URL: http://em-agent:8080
      ENG_AGENT_URL: http://engineer-agent:8080
      QA_AGENT_URL: http://qa-agent:8080
      REPO_URL: ${REPO_URL:-}
      GIT_SSH_KEY: /run/secrets/github_ssh_key
      REPO_DEFAULT_BRANCH: ${REPO_DEFAULT_BRANCH:-main}
      MAX_QA_ROUNDS: ${MAX_QA_ROUNDS:-}
    volumes:
      - ./:/workspace
      - ./state:/app/state
      - ${SSH_KEY_PATH:-~/.ssh/id_speedster}:/run/secrets/github_ssh_key:ro
    working_dir: /workspace
    depends_on: [em-agent, engineer-agent, qa-agent]
    restart: unless-stopped

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speedster"
version = "0.1.0"
description = "Autonomous agent orchestrator with EM, Engineer, and QA roles"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
speedster = "speedster.main:main"

[tool.setuptools.packages.find]
include = ["speedster*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

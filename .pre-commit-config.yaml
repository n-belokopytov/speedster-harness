repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -S warning
        language: system
        files: (opencode-setup|setup)\.sh$
